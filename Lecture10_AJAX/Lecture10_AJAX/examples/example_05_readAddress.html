<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title> Ajax XML example 2</title>  
  <style>
    table{border:2pt solid #000;border-collapse:collapse; background-color:#CCFFCC;}
    td,th{border:1pt solid #000;}
  </style>
  
<script>
	function start() {
	  xhr=new XMLHttpRequest();
	  if (xhr==null) {
		alert ("Browser does not support HTTP Request");
	  } else {
		var url="Address.xml";
		xhr.onreadystatechange=showXML;
		xhr.open("GET",url,true);
		xhr.send(null);
	  }
	}

	function showXML() {
	  if (xhr.readyState == 4 && xhr.status == 200) {
		var xmlDoc = xhr.responseXML;
		var strOutput;
		
		strOutput="<table><tr><th>firstname</th><th>name</th><th>street</th><th>postal code</th><th>city</th><th>phone number</th></tr>";

		var number = xmlDoc.getElementsByTagName("firstname").length;  
		for (var i = 0; i < number; i++) {
		  strOutput += "<tr><td>" + xmlDoc.getElementsByTagName("firstname")[i].childNodes[0].nodeValue + "</td>";
		  strOutput += "<td>" +xmlDoc.getElementsByTagName("name")[i].childNodes[0].nodeValue + "</td>";
		  strOutput += "<td>" +xmlDoc.getElementsByTagName("streetNo")[i].childNodes[0].nodeValue + "</td>";
		  strOutput += "<td>" +xmlDoc.getElementsByTagName("postalCode")[i].childNodes[0].nodeValue + "</td>";
		  strOutput += "<td>" +xmlDoc.getElementsByTagName("city")[i].childNodes[0].nodeValue + "</td>";
		  strOutput += "<td>" +xmlDoc.getElementsByTagName("phone")[i].childNodes[0].nodeValue + "</td></tr>";
		}
		strOutput += "</table>";
	  }
	  document.getElementById("table").innerHTML = strOutput;
	}

</script>
</head>

<body>
<h2>An introduction to <span>Ajax</span>; read addresses.xml</h2>
<form action="#">
  	<p>
	  <input type="button" 
			 value="Click to see the contents of the XML file 'addresses.xml' below" 
			 onclick="start()" />
	</p>
</form>
<div id="table"></div>

</body>
</html>
