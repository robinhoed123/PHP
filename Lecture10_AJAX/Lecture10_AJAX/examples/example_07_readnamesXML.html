<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ajax XML: names list</title>
  <style>
    div{width:500px; background-color:#CCFFCC;}
    ul{padding-top:1em;padding-bottom:1em;}
  </style>
<script>
 
function start() {
  var xhr = new XMLHttpRequest();
  if (xhr == null) {
    alert ("Browser does not support HTTP Request");
  } else {
    xhr.onreadystatechange=function() {
      if (xhr.readyState == 4 && xhr.status == 200) {
        showXML(xhr.responseXML);
      }
    };
    xhr.open("GET","names.xml",true);
    xhr.send(null);
  }
}

function showXML(xmldomdoc) {
  var fistnames = xmldomdoc.getElementsByTagName('firstname');
  var lastnames = xmldomdoc.getElementsByTagName('lastname');

  var eUl = document.createElement('ul');

  for (var i = 0; i < fistnames.length; i++) {
    var str = fistnames[i].firstChild.nodeValue + ' ' + lastnames[i].firstChild.nodeValue;
    var eLi = document.createElement('li');
    eLi.appendChild(document.createTextNode(str));
    eUl.appendChild(eLi);
  }
  document.getElementById("output").appendChild(eUl);
}  

</script>
</head>

<body>
	<h2>Ajax XML: readXML.html</h2>
	<form action="#">
	  <p><input type="button" value="Click to see the contents of the XML file 'names.xml' below" onclick="start()" /></p>
	</form>
	<div id="output"></div>
</body>
</html>
