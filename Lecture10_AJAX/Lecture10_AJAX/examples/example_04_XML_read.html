<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ajax XML example 1</title>
  <style>
    div{width:500px; border:solid; border-width:1px 0px; background-color:#CCFFCC;}
  </style>

<script>

	function start() {
	   xhr=new XMLHttpRequest();
	   if (xhr==null) {
		  alert ("Browser does not support HTTP Request");
		} else {
			var url="text.xml";
			xhr.onreadystatechange=showXML;
			xhr.open("GET",url,true);
			xhr.send(null);
		}
		
	}

	function showXML() {
	   if (xhr.readyState==4 && xhr.status==200) {
		  var xmldoc = xhr.responseXML;
		  var root_node = xmldoc.getElementsByTagName('root').item(0);
		  document.getElementById("textBox").innerHTML = root_node.firstChild.data;
	   }
	}  

</script>
</head>

<body>
	<h2>An introduction to <span>Ajax</span>; example2</h2>
	<form action="#">
	  <p>
		<input type="button" 
			   value="Click to see the content of the XML file 'text.xml' below" 
			   onclick="start()" />
	  </p>
	</form>
	<div id="textBox"></div>
</body>
</html>
